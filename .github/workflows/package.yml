name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Firebase Apple SDK version, e.g. 12.19.3
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: cd .scripts && bash ./package.sh "$VERSION"
